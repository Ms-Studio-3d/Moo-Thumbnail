name: Build lightweight Windows release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read
concurrency:
  group: native-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Compile C# and run core and UI tests
        shell: pwsh
        run: ./build-native.ps1

      - name: Read and validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' }}
        run: |
          $version = ([version](Get-Item dist-native/Moo-Thumbnail.exe).VersionInfo.FileVersion).ToString(3)
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          if ($env:IS_RELEASE -eq 'true' -and $env:RELEASE_TAG -ne "v$version") { throw "Tag must be v$version" }

      - name: Install NSIS build compiler
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Could not install NSIS' }

      - name: Build small installer
        shell: pwsh
        run: ./build-installer.ps1

      - name: Prepare portable EXE and checksums
        shell: pwsh
        run: |
          Copy-Item dist-native/Moo-Thumbnail.exe "dist-native/Moo-Thumbnail-$env:APP_VERSION-Portable.exe"
          $assets = Get-ChildItem dist-native/*-Portable.exe,dist-native/*-Setup.exe
          $assets | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name } | Set-Content dist-native/SHA256SUMS.txt -Encoding utf8

      - name: Upload downloads
        uses: actions/upload-artifact@v7
        with:
          name: Moo-Thumbnail-Windows
          path: |
            dist-native/*-Portable.exe
            dist-native/*-Setup.exe
            dist-native/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title "Moo-Thumbnail $env:RELEASE_TAG" --notes-file RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem dist-native/*-Portable.exe,dist-native/*-Setup.exe | ForEach-Object FullName)
          $assets += (Resolve-Path dist-native/SHA256SUMS.txt).Path
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
