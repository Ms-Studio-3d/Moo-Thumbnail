name: Test, build and release portable Windows app

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: portable-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Release tag must be v$version" }

      - name: Test link parsing, qualities, errors and saving
        run: npm test

      - name: Test real main, preload, renderer and IPC
        run: npm run test:smoke

      - name: Build portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist/*-Portable-*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding utf8

      - name: Upload portable EXE and checksums
        uses: actions/upload-artifact@v7
        with:
          name: Moo-Thumbnail-Portable-Windows-x64
          path: |
            dist/*-Portable-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish or update release assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title "Moo-Thumbnail $env:RELEASE_TAG" --notes-file RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          $assets = @(Get-ChildItem dist/*-Portable-*.exe | ForEach-Object FullName)
          $assets += (Resolve-Path dist/SHA256SUMS.txt).Path
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
